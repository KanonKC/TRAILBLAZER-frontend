services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_TWITCH_LOGIN_URL=${NEXT_PUBLIC_TWITCH_LOGIN_URL}
      - NEXT_PUBLIC_YOUTUBE_CLIENT_ID=${NEXT_PUBLIC_YOUTUBE_CLIENT_ID}
      - NEXT_PUBLIC_DISCORD_CLIENT_ID=${NEXT_PUBLIC_DISCORD_CLIENT_ID}
      - NEXT_PUBLIC_SPOTIFY_CLIENT_ID=${NEXT_PUBLIC_SPOTIFY_CLIENT_ID}
      - NEXT_PUBLIC_ACCOUNT_BINDING_CALLBACK_URL=${NEXT_PUBLIC_ACCOUNT_BINDING_CALLBACK_URL}
    restart: always
